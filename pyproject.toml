dependencies = [
    "beautifulsoup4>=4.14.3",
    "google-generativeai>=0.8.6",
    "huggingface-hub>=1.27.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.14",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-huggingface>=1.2.2",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.61.1",
    "transformers>=5.14.1",
]

[project.scripts]
langchain-models = "langchain_models:main"

[build-system]
