[project]
name = "langgraphstuff"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Qasim Ahmad", email = "qasimahmad2555@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "grandalf>=0.8",
    "langchain>=1.5.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.2.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
langgraphstuff = "langgraphstuff:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
